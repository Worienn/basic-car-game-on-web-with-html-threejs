<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Car Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #111;
            user-select: none;
        }

        #game-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-size: 20px;
            pointer-events: none;
            z-index: 10;
        }

        #game-over-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 20;
        }

        #game-over-screen h1 {
            font-size: 54px;
            color: #ff3333;
            margin-bottom: 10px;
        }

        #game-over-screen p {
            font-size: 24px;
            margin-bottom: 25px;
        }

        #restart-btn {
            padding: 12px 30px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            background: #28a745;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(40,167,69,0.4);
            transition: transform 0.1s, background 0.2s;
        }

        #restart-btn:hover {
            background: #218838;
            transform: scale(1.05);
        }

        .controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            pointer-events: none;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <div id="game-ui">
        <div>Score: <span id="score-val">0</span> m</div>
        <div>Speed: <span id="speed-val">0</span> km/s</div>
    </div>

    <div class="controls-hint">
        Controls: W / A / S / D or Arrow Keys
    </div>

    <div id="game-over-screen">
        <h1>YOU CRASHED!</h1>
        <p>Total Distance: <span id="final-score">0</span> m</p>
        <button id="restart-btn" onclick="restartGame()">Play Again</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); 
        scene.fog = new THREE.Fog(0x87CEEB, 40, 180);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 250;
        dirLight.shadow.camera.left = -40;
        dirLight.shadow.camera.right = 40;
        dirLight.shadow.camera.top = 40;
        dirLight.shadow.camera.bottom = -40;
        scene.add(dirLight);

        const ROAD_WIDTH = 18;
        const ROAD_LENGTH = 400;

        const roadGeo = new THREE.PlaneGeometry(ROAD_WIDTH, ROAD_LENGTH);
        const roadMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.receiveShadow = true;
        scene.add(road);

        const grassGeo = new THREE.PlaneGeometry(300, ROAD_LENGTH);
        const grassMat = new THREE.MeshLambertMaterial({ color: 0x3d8c40 });
        const grass = new THREE.Mesh(grassGeo, grassMat);
        grass.rotation.x = -Math.PI / 2;
        grass.position.y = -0.05;
        grass.receiveShadow = true;
        scene.add(grass);

        const lineGeo = new THREE.PlaneGeometry(0.4, 4);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const roadLines = [];
        for (let i = -ROAD_LENGTH / 2; i < ROAD_LENGTH / 2; i += 8) {
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.rotation.x = -Math.PI / 2;
            line.position.set(0, 0.02, i);
            scene.add(line);
            roadLines.push(line);
        }

        function createCarMesh(colorHex = 0xd32f2f) {
            const carGroup = new THREE.Group();

            const bodyGeo = new THREE.BoxGeometry(2, 0.6, 4.2);
            const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.6;
            body.castShadow = true;
            carGroup.add(body);

            const cabinGeo = new THREE.BoxGeometry(1.6, 0.65, 2.2);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 1.1, -0.2);
            cabin.castShadow = true;
            carGroup.add(cabin);

            const lightGeo = new THREE.BoxGeometry(0.35, 0.15, 0.1);
            const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffcc });
            const leftLight = new THREE.Mesh(lightGeo, lightMat);
            leftLight.position.set(-0.65, 0.65, -2.11);
            const rightLight = leftLight.clone();
            rightLight.position.x = 0.65;
            carGroup.add(leftLight, rightLight);

            const tailLightMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const leftTail = new THREE.Mesh(lightGeo, tailLightMat);
            leftTail.position.set(-0.65, 0.65, 2.11);
            const rightTail = leftTail.clone();
            rightTail.position.x = 0.65;
            carGroup.add(leftTail, rightTail);

            const wheelGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.35, 16);
            const wheelMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
            const wheelPositions = [
                [-1.0, 0.38, -1.3],
                [1.0, 0.38, -1.3],
                [-1.0, 0.38, 1.3],
                [1.0, 0.38, 1.3]
            ];

            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(...pos);
                wheel.castShadow = true;
                carGroup.add(wheel);
            });

            return carGroup;
        }

        const playerCar = createCarMesh(0x0066cc);
        scene.add(playerCar);

        const trafficCars = [];
        const trafficColors = [0xd32f2f, 0x2e7d32, 0xfbc02d, 0x7b1fa2, 0xffffff];
        const LANE_X = [-5.5, 0, 5.5];

        function spawnTrafficCar(zOffset = -150) {
            const randomColor = trafficColors[Math.floor(Math.random() * trafficColors.length)];
            const trafficCar = createCarMesh(randomColor);
            
            const lane = LANE_X[Math.floor(Math.random() * LANE_X.length)];
            trafficCar.position.set(lane, 0, zOffset);
            
            trafficCar.userData = {
                speed: 0.2 + Math.random() * 0.15
            };

            scene.add(trafficCar);
            trafficCars.push(trafficCar);
        }

        for (let i = 0; i < 5; i++) {
            spawnTrafficCar(-40 - (i * 35));
        }

        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, s: false, a: false, d: false };

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
            if (keys.hasOwnProperty(key)) keys[key] = true;
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
            if (keys.hasOwnProperty(key)) keys[key] = false;
        });

     
        let speed = 0;
        const maxForwardSpeed = 1.1;
        const maxReverseSpeed = -0.3;
        const acceleration = 0.005;
        const friction = 0.008;
        const turnSpeed = 0.035;

        let distance = 0;
        let isGameOver = false;

        const scoreValEl = document.getElementById('score-val');
        const speedValEl = document.getElementById('speed-val');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');

      
        const playerBox = new THREE.Box3();
        const trafficBox = new THREE.Box3();

      
        function animate() {
            if (isGameOver) return;

            requestAnimationFrame(animate);

            const forward = keys.ArrowUp || keys.w;
            const backward = keys.ArrowDown || keys.s;

            if (forward) {
                speed += acceleration;
                if (speed > maxForwardSpeed) speed = maxForwardSpeed;
            } else if (backward) {
                speed -= acceleration;
                if (speed < maxReverseSpeed) speed = maxReverseSpeed;
            } else {
                // Sürtünme ile durma
                if (speed > 0) {
                    speed -= friction;
                    if (speed < 0) speed = 0;
                } else if (speed < 0) {
                    speed += friction;
                    if (speed > 0) speed = 0;
                }
            }

            const left = keys.ArrowLeft || keys.a;
            const right = keys.ArrowRight || keys.d;

            if (Math.abs(speed) > 0.02) {
                const directionFactor = speed > 0 ? 1 : -1;
                if (left) playerCar.rotation.y += turnSpeed * directionFactor;
                if (right) playerCar.rotation.y -= turnSpeed * directionFactor;
            }

            playerCar.position.x -= Math.sin(playerCar.rotation.y) * speed;
            playerCar.position.z -= Math.cos(playerCar.rotation.y) * speed;


            const halfRoad = ROAD_WIDTH / 2 - 1.2;
            if (playerCar.position.x < -halfRoad) {
                playerCar.position.x = -halfRoad;
                speed *= 0.7;
            } else if (playerCar.position.x > halfRoad) {
                playerCar.position.x = halfRoad;
                speed *= 0.7;
            }

            road.position.z = playerCar.position.z;
            grass.position.z = playerCar.position.z;

            roadLines.forEach(line => {
                if (line.position.z - playerCar.position.z > 50) {
                    line.position.z -= ROAD_LENGTH;
                } else if (line.position.z - playerCar.position.z < -ROAD_LENGTH + 50) {
                    line.position.z += ROAD_LENGTH;
                }
            });

            playerBox.setFromObject(playerCar);
            
            playerBox.expandByScalar(-0.2);

            trafficCars.forEach(car => {
            
                car.position.z += car.userData.speed;

              
                if (car.position.z - playerCar.position.z > 30) {
                    car.position.z = playerCar.position.z - (120 + Math.random() * 60);
                    car.position.x = LANE_X[Math.floor(Math.random() * LANE_X.length)];
                }

                trafficBox.setFromObject(car);
                trafficBox.expandByScalar(-0.2);

                if (playerBox.intersectsBox(trafficBox)) {
                    triggerGameOver();
                }
            });

            const cameraOffset = new THREE.Vector3(0, 4.5, 9);
            cameraOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), playerCar.rotation.y);
            const targetCamPos = playerCar.position.clone().add(cameraOffset);
            camera.position.lerp(targetCamPos, 0.1);

            const lookAtTarget = playerCar.position.clone().add(new THREE.Vector3(0, 1, -2).applyAxisAngle(new THREE.Vector3(0, 1, 0), playerCar.rotation.y));
            camera.lookAt(lookAtTarget);

            dirLight.position.z = playerCar.position.z + 50;
            dirLight.target = playerCar;

            distance = Math.max(0, Math.floor(-playerCar.position.z));
            scoreValEl.innerText = distance;
            speedValEl.innerText = Math.round(speed * 130);

            renderer.render(scene, camera);
        }

        function triggerGameOver() {
            isGameOver = true;
            finalScoreEl.innerText = distance;
            gameOverScreen.style.display = 'flex';
        }

        function restartGame() {
        
            speed = 0;
            distance = 0;
            isGameOver = false;
            gameOverScreen.style.display = 'none';

           
            playerCar.position.set(0, 0, 0);
            playerCar.rotation.set(0, 0, 0);

           
            trafficCars.forEach((car, index) => {
                car.position.set(
                    LANE_X[Math.floor(Math.random() * LANE_X.length)],
                    0,
                    -40 - (index * 40)
                );
            });

            animate();
        }


        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    
        animate();
    </script>
</body>
</html>
